name: Release

# Publica una version al subir una etiqueta vX.Y.Z (ver scripts/release.sh):
#   1. comprueba que la etiqueta coincide con VERSION.txt,
#   2. ejecuta el CI completo (compila, prueba y genera los instaladores),
#   3. crea la release de GitHub con el .exe, el .msi y el .deb,
#   4. despliega la web, que enlaza los instaladores de esa release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Verificar version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          file_version="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "${version}" != "${file_version}" ]]; then
            echo "::error::La etiqueta ${tag} no coincide con VERSION.txt (${file_version}). Usa scripts/release.sh."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publicar release
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar instaladores
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Reunir y verificar archivos
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          expected=(
            "dist-artifacts/aymaralang-windows/AymaraLang-Setup.exe"
            "dist-artifacts/aymaralang-windows/AymaraLang-Setup.msi"
            "dist-artifacts/aymaralang-deb/aymaralang_${VERSION}_amd64.deb"
          )
          for f in "${expected[@]}"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Falta el instalador $f"
              find dist-artifacts -maxdepth 2 -type f | sort
              exit 1
            fi
            cp "$f" release/
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Crear release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Reintento del workflow: reemplaza los archivos de la release existente.
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "AymaraLang $TAG" --generate-notes --verify-tag
          fi

  deploy-web:
    name: Desplegar web
    needs: [version, publish]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar credenciales de Cloudflare
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID del repositorio. La release ya esta publicada; configura los secretos y relanza este job."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Enlazar los instaladores de la release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-release.mjs --tag "${{ needs.version.outputs.tag }}" --check

      - run: npm run build

      - name: Desplegar en Cloudflare
        run: npx wrangler deploy
